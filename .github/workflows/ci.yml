name: Next.js CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run Linter
      run: npm run lint

    - name: Build Next.js app
      run: npm run build
      env:
        DATABASE_URL: "file:./dev.db"
        JWT_SECRET: "ci-test-jwt-secret-key-placeholder"
        ENCRYPTION_KEY: "ci-test-db-encryption-key-placeholder-32-chars"
        NEXT_PUBLIC_APP_NAME: "SocietyVault"
        NODE_ENV: "production"
